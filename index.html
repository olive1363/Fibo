async function getJSON(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
  try{
    const sep=url.includes('?')?'&':'?',fresh=url+sep+'_='+Date.now();
    const r=await fetch(fresh,{signal:c.signal,cache:'no-store',mode:'cors',headers:{'Accept':'application/json'}});
    if(!r.ok)throw Error('HTTP '+r.status);
    return await r.json();
  }finally{clearTimeout(t)}
}
async function getProviderJSON(url){
  let last;
  const urls=[
    url,
    'https://corsproxy.io/?'+encodeURIComponent(url),
    'https://api.allorigins.win/raw?url='+encodeURIComponent(url)
  ];
  for(const u of urls){
    try{return await getJSON(u)}catch(e){last=e}
  }
  throw last||Error('Source indisponible');
}

function aggregate4hFrom1h(data){
  const m=new Map();
  for(const r of data){
    const d=new Date(r.ms),h=Math.floor(d.getUTCHours()/4)*4,key=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),h);
    let q=m.get(key);
    if(!q){q={ms:key,open:r.open,high:r.high,low:r.low,close:r.close,volume:r.volume||0};m.set(key,q)}
    else{q.high=Math.max(q.high,r.high);q.low=Math.min(q.low,r.low);q.close=r.close;q.volume+=(r.volume||0)}
  }
  return [...m.values()].sort((a,b)=>a.ms-b.ms)
}

function aggregate(data,mode){const m=new Map();for(const r of data){const d=new Date(r.ms);let key;if(mode==='1w'){const day=(d.getUTCDay()+6)%7,dt=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-day));key=dt.toISOString().slice(0,10)}else key=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;let q=m.get(key);if(!q){q={ms:r.ms,open:r.open,high:r.high,low:r.low,close:r.close,volume:r.volume||0};m.set(key,q)}else{q.high=Math.max(q.high,r.high);q.low=Math.min(q.low,r.low);q.close=r.close;q.ms=r.ms;q.volume+=(r.volume||0)}}return [...m.values()].sort((a,b)=>a.ms-b.ms)}
function rsiWilder(data,n=13){if(data.length<=n)return [];let gains=0,losses=0,out=[];for(let i=1;i<=n;i++){const d=data[i].close-data[i-1].close;d>=0?gains+=d:losses-=d}let ag=gains/n,al=losses/n;const val=()=>al===0?100:100-100/(1+ag/al);out.push({ms:data[n].ms,v:val(),i:n});for(let i=n+1;i<data.length;i++){const d=data[i].close-data[i-1].close,g=d>0?d:0,l=d<0?-d:0;ag=(ag*(n-1)+g)/n;al=(al*(n-1)+l)/n;out.push({ms:data[i].ms,v:val(),i})}return out}
function shallow(c){return +c.levels.find(q=>q.p==='38,20%')?.v}
function previousFibLevels(c,zone){const zero=+c.levels.find(q=>q.p==='0,00%')?.v,hundred=+c.levels.find(q=>q.p==='100,00%')?.v;if(!Number.isFinite(zero)||!Number.isFinite(hundred))return [];const range=Math.abs(zero-hundred);if((zone||'').toUpperCase()==='BULL'){return [{p:'Anc 38,20%',v:zero+range*0.382,previous:true},{p:'Anc 61,80%',v:zero+range*0.618,previous:true},{p:'Anc 100,00%',v:zero+range,previous:true}]}return [{p:'Anc 38,20%',v:hundred-range*0.382,previous:true},{p:'Anc 61,80%',v:hundred-range*0.618,previous:true},{p:'Anc 100,00%',v:hundred-range,previous:true}]}
function zoneChangeAnchor(seg,changeCandle){const bull=seg.zone==='BULL';return bull?changeCandle.low:changeCandle.high}
function fibLevelsForZone(rows,seg){const zr=rows.filter(r=>r.ms>=seg.start&&r.ms<=seg.end);if(!zr.length)return [];const bull=seg.zone==='BULL',change=zr[0],hundred=zoneChangeAnchor(seg,change),zero=bull?Math.max(...zr.map(r=>r.high)):Math.min(...zr.map(r=>r.low)),span=hundred-zero;const ratios=[['0,00%',0],['38,20%',.382],['61,80%',.618],['100,00%',1],['127,20%',1.272],['141,40%',1.414],['200,00%',2]];return ratios.map(([p,r])=>({p,v:zero+span*r,n:p==='38,20%'?'shallow fib':null,zone:seg.zone}));}

async function refresh(tf,dailyCache){const st=document.getElementById('st-'+tf);st.textContent='Actualisation en cours…';try{let rows,source;if(tf==='4h'){const pack=await load4h();rows=pack.rows;source=pack.source}else{const pack=dailyCache||await loadDaily(),d=pack.rows;source=pack.source;if(tf==='1d'){rows=d.slice(-430)}else if(tf==='1w'){rows=aggregate(d,'1w').slice(-280);source+=' → agrégé semaine'}else{rows=aggregate(d,'1m').slice(-70);source+=' → agrégé mois'}}if(rows.length<20)throw Error('Pas assez de données');const oldView=state[tf]?.view||null,oldDisplay=state[tf]?.display||{last2:false,last1:true},oldDisabled=state[tf]?.disabledChanges||new Set(),oldManual=state[tf]?.manualFibZones||new Set(),oldTargets=state[tf]?.targets||new Set();state[tf]={rows,source,view:oldView,display:oldDisplay,drag:null,manualFibZones:oldManual,disabledChanges:oldDisabled,targets:oldTargets};draw(tf);const last=rows.at(-1);st.textContent+=` · source ${source}${tf==='4h'?' · historique ~'+Math.round((rows.at(-1).ms-rows[0].ms)/DAY)+' jours':''} · actualisé ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;return true}catch(e){st.textContent='Actualisation impossible : '+(e.message||e)+' · vérifiez la connexion Internet ou ouvrez le fichier depuis un serveur web.';return false}}
async function refreshAll(){const btn=document.getElementById('refreshAll');btn.disabled=true;btn.textContent='Actualisation…';let daily=null;try{daily=await loadDaily()}catch(e){}await Promise.all(['4h','1d','1w','1m'].map(tf=>refresh(tf,daily)));btn.disabled=false;btn.textContent='↻ Actualiser les graphes'}
document.querySelectorAll('[data-reset]').forEach(b=>b.addEventListener('click',()=>resetView(b.dataset.reset)));
document.querySelectorAll('[data-refresh]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;const old=b.textContent;b.textContent='Actualisation…';await refresh(b.dataset.refresh);b.disabled=false;b.textContent=old}));
document.querySelectorAll('[data-zone-filter]').forEach(inp=>inp.addEventListener('change',e=>{const tf=e.target.dataset.tf,mode=e.target.dataset.zoneFilter,st=ensureState(tf).display;if(mode==='last1'){st.last1=e.target.checked;if(e.target.checked)st.last2=false;}else if(mode==='last2'){st.last2=e.target.checked;if(e.target.checked)st.last1=false;}draw(tf);}));
const simDate=document.getElementById('simDate'),simState=document.getElementById('simState');
simDate.max=new Date().toISOString().slice(0,10);
function applySimulation(){simulationCutoff=parseSimulationDate(simDate.value);simState.textContent=simulationLabel();Object.keys(CFG).forEach(tf=>{if(state[tf])state[tf].view=null;draw(tf)});}
document.getElementById('applySim').addEventListener('click',applySimulation);
simDate.addEventListener('change',applySimulation);
document.getElementById('simToday').addEventListener('click',()=>{simDate.value='';simulationCutoff=null;simState.textContent=simulationLabel();Object.keys(CFG).forEach(tf=>{if(state[tf])state[tf].view=null;draw(tf)});});
document.getElementById('refreshAll').addEventListener('click',refreshAll);refreshAll();
})();
</script>
