async function getJSON(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
  try{
    const sep=url.includes('?')?'&':'?',fresh=url+sep+'_='+Date.now();
    const r=await fetch(fresh,{signal:c.signal,cache:'no-store',mode:'cors',headers:{'Accept':'application/json'}});
    if(!r.ok)throw Error('HTTP '+r.status);
    return await r.json();
  }finally{clearTimeout(t)}

async function getProviderJSON(url){
  let last, errors=[];
  const candidates=[
    {name:'direct',url},
    {name:'isomorphic-git',url:'https://cors.isomorphic-git.org/'+url},
    {name:'allorigins',url:'https://api.allorigins.win/raw?url='+encodeURIComponent(url)},

    {name:'corsproxy.io',url:'https://corsproxy.io/?'+encodeURIComponent(url)}
  ];
  for(const c of candidates){
    try{return await getJSON(c.url)}catch(e){last=e;errors.push(c.name+': '+(e.message||e))}
  }

function aggregate4hFrom1h(data){
  const m=new Map();
  for(const r of data){
    const d=new Date(r.ms),h=Math.floor(d.getUTCHours()/4)*4,key=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),h);
    let q=m.get(key);
    if(!q){q={ms:key,open:r.open,high:r.high,low:r.low,close:r.close,volume:r.volume||0};m.set(key,q)}
    else{q.high=Math.max(q.high,r.high);q.low=Math.min(q.low,r.low);q.close=r.close;q.volume+=(r.volume||0)}
  }
  return [...m.values()].sort((a,b)=>a.ms-b.ms)
}

function aggregateMarket4h(data){
  const byDay=new Map();
  for(const r of data){const d=new Date(r.ms),k=d.toISOString().slice(0,10);if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(r)}
  const out=[];
  for(const day of byDay.values()){
    day.sort((a,b)=>a.ms-b.ms);
    for(let i=0;i<day.length;i+=4){const g=day.slice(i,i+4);if(!g.length)continue;out.push({ms:g[0].ms,open:g[0].open,high:Math.max(...g.map(x=>x.high)),low:Math.min(...g.map(x=>x.low)),close:g.at(-1).close,volume:g.reduce((a,x)=>a+(x.volume||0),0)})}
  }
  return normalizeRows(out);
}

  [0,.25,.5,.75,1].forEach(f=>{const ms=compactSession?msAtIdx(idxMin+f*idxSpan):minMs+(maxMs-minMs)*f,t=el('text',{x:L+f*(W-L-R),y:rsiB-6,'text-anchor':'middle',fill:'#365a3b','font-size':11});t.textContent=new Date(ms).toLocaleDateString('fr-FR',tf==='1m'?{month:'short',year:'2-digit'}:{day:'2-digit',month:'short',year:'2-digit'});svg.append(t)});
  // zones d'axes interactives (transparentes)
  svg.append(el('rect',{x:L,y:rsiB,width:W-L-R,height:H-rsiB,fill:'transparent','data-axis':'x',style:'cursor:ew-resize'}));
  svg.append(el('rect',{x:W-R,y:T,width:R,height:priceB-T,fill:'transparent','data-axis':'y',style:'cursor:ns-resize'}));

  svg.onpointermove=e=>{const g=geom(e),drag=state[tf].drag;if(drag){e.preventDefault();const plotPx=Math.max(1,g.b.width*(W-L-R)/W),plotPy=Math.max(1,g.b.height*(priceB-T)/H),dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.axis==='x'||drag.axis==='xy'){const shiftX=-dx/plotPx*(drag.x1-drag.x0);state[tf].view.x0=drag.x0+shiftX;state[tf].view.x1=drag.x1+shiftX}if(drag.axis==='y'||drag.axis==='xy'){const shiftY=dy/plotPy*(drag.p1-drag.p0);state[tf].view.p0=drag.p0+shiftY;state[tf].view.p1=drag.p1+shiftY}draw(tf);svg.classList.add('dragging');return}
    if(g.px<L||g.px>W-R||g.py>priceB){tip.style.display='none';return}const frac=(g.px-L)/(W-L-R);let r;if(compactSession){const pos=idxMin+frac*idxSpan;if(pos>rows.length-1+.45){tip.style.display='none';return}r=rows[Math.max(0,Math.min(rows.length-1,Math.round(pos)))]}else{const ms=minMs+frac*(maxMs-minMs);if(ms>rows.at(-1).ms){tip.style.display='none';return}r=rows.reduce((best,a)=>Math.abs(a.ms-ms)<Math.abs(best.ms-ms)?a:best,rows[0])}const rv=rr.reduce((best,a)=>Math.abs(a.ms-r.ms)<Math.abs(best.ms-r.ms)?a:best,rr[0]);tip.innerHTML=`<b>${new Date(r.ms).toLocaleString('fr-FR')}</b><br>O ${money(r.open)} · H ${money(r.high)}<br>L ${money(r.low)} · C <b>${money(r.close)}</b><br>RSI 13 : ${rv&&Number.isFinite(rv.v)?rv.v.toFixed(2).replace('.',','):'—'}<br>Shallow Fib : ${money(sh)}`;tip.style.display='block';tip.style.left=Math.min(g.b.width-250,Math.max(8,e.clientX-g.b.left+12))+'px';tip.style.top=Math.min(g.b.height-120,Math.max(8,e.clientY-g.b.top+12))+'px'};

async function refresh(tf,dailyCache){const st=document.getElementById('st-'+tf);st.textContent='Actualisation en cours…';try{let rows,source;if(tf==='1h'){const pack=await load1h();rows=pack.rows;source=pack.source}else if(tf==='4h'){const pack=await load4h();rows=pack.rows;source=pack.source}else{const pack=dailyCache||await loadDaily(),d=pack.rows;source=pack.source;if(tf==='1d'){rows=d.slice(-430)}else if(tf==='1w'){rows=aggregate(d,'1w').slice(-280);source+=' → agrégé semaine'}else{rows=aggregate(d,'1m').slice(-70);source+=' → agrégé mois'}}if(rows.length<20)throw Error('Pas assez de données');const oldView=(MOBILE_LAYOUT&&tf==='1h')?null:(state[tf]?.view||null),oldDisplay=state[tf]?.display||{},oldDisabled=state[tf]?.disabledChanges||new Set(),oldManual=state[tf]?.manualFibZones||new Set(),oldTargets=state[tf]?.targets||new Set();state[tf]={rows,source,view:oldView,display:oldDisplay,drag:null,manualFibZones:oldManual,disabledChanges:oldDisabled,targets:oldTargets};draw(tf);const last=rows.at(-1);const modeNote=ASSETS[activeAsset].kind==='crypto'?' · marché 24/7':' · séances réelles uniquement · axe compact sans trous nuit/week-end';st.textContent+=` · source ${source}${modeNote}${(tf==='1h'||tf==='4h')?' · historique ~'+Math.round((rows.at(-1).ms-rows[0].ms)/DAY)+' jours':''} · actualisé ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;return true}catch(e){st.textContent='Actualisation impossible : '+(e.message||e)+' · Pour les actions, vérifie que le dossier data/ a été généré par GitHub Actions.';return false}}
async function refreshAll(){const btn=document.getElementById('refreshAll');btn.disabled=true;btn.textContent='Actualisation…';let daily=null;try{if(activeTf==='1h'||activeTf==='4h'){await refresh(activeTf,null);try{daily=await loadDaily()}catch(e){}const rest=['1h','4h','1d','1w','1m'].filter(tf=>tf!==activeTf);await Promise.all(rest.map(tf=>refresh(tf,daily)))}else{try{daily=await loadDaily()}catch(e){}await refresh(activeTf,daily);const rest=['1h','4h','1d','1w','1m'].filter(tf=>tf!==activeTf);await Promise.all(rest.map(tf=>refresh(tf,daily)))} }finally{btn.disabled=false;btn.textContent='↻ Actualiser les graphes'}}

document.getElementById('exportSettings').addEventListener('click',()=>{const data=JSON.stringify(serializableSettings(),null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fiboswanny-reglages.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);const s=document.getElementById('settingsStatus');if(s)s.textContent='Réglages exportés · Targets + zones neutralisées + zones Fibonacci';});
