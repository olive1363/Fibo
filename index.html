<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#071421">
<title>FiboSwanny v5 · BTC</title>
<style>
:root{--bg:#071421;--panel:#0d2133;--border:#29445d;--text:#eaf2f8;--muted:#9db2c6;--accent:#ff9818;--greenbg:#a9d9aa;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overscroll-behavior:none}
body{min-height:100vh}
.wrap{max-width:1600px;margin:auto;padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}.btc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);font-weight:900;font-size:24px}.title{font-size:25px;font-weight:850}.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--border);background:#10263b;color:var(--text);padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;text-decoration:none;touch-action:manipulation}.btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.kicker{display:inline-block;background:#5b2f00;color:#ffd59b;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.04em}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{background:#d6f0d5;color:#17391d;border:1px solid #78ad7b;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.chartwrap{position:relative;border:1px solid #6d9d70;background:var(--greenbg);overflow:hidden;border-radius:8px;touch-action:pan-x pan-y pinch-zoom}.chart{display:block;width:100%;min-height:610px;user-select:none;-webkit-user-select:none}.tip{display:none;position:absolute;z-index:5;pointer-events:none;min-width:235px;background:#effbef;color:#142b17;border:1px solid #527a56;border-radius:8px;padding:10px;font-size:12px;line-height:1.45;box-shadow:0 8px 28px #1b3d1f33}.status{margin-top:9px;color:#b9ccdb;font-size:12px}.legend{margin-top:10px;font-size:12px;color:#b9ccdb}.thresholds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.threshold{background:#122a40;border:1px solid var(--border);border-radius:10px;padding:10px}.threshold b{display:block;font-size:12px;color:#fff}.threshold span{font-size:12px;color:var(--muted)}
.mobile-toolbar{display:none;gap:7px;margin:8px 0 10px;position:sticky;top:0;z-index:20;padding:8px 0;background:linear-gradient(var(--panel) 82%,transparent)}
.mobile-toolbar .btn{flex:1;padding:10px 8px;font-size:12px}.mobile-toolbar .btn.active{background:var(--accent);color:#111;border-color:var(--accent)}
.mobile-only{display:none}.desktop-actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:760px){
  body{padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
  .wrap{padding:8px 6px 10px;max-width:none}
  .top{margin-bottom:8px;padding:0 2px;align-items:flex-start}
  .brand{gap:8px}.btc{width:34px;height:34px;font-size:20px}.title{font-size:19px;line-height:1.1}.sub{font-size:11px;line-height:1.25}
  .desktop-actions{display:none}.mobile-only{display:block}.mobile-toolbar{display:flex}
  .grid{gap:8px}.panel{padding:8px;border-radius:12px}.panel:not(#panel-4h){display:none}
  #panel-4h .head{display:none}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:4px 0 8px}.chip{padding:7px 8px;font-size:11px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ct-4h{display:none}
  .chartwrap{border-radius:10px;overflow:hidden}
  .chart{min-height:0;height:68vh;max-height:760px}
  .tip{min-width:180px;max-width:78vw;font-size:11px;padding:8px}
  .status{font-size:11px;margin:6px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thresholds{display:none}
}
@media(max-width:430px){.chart{height:66vh}.chips{grid-template-columns:1fr 1fr}.chip{font-size:10.5px}}
@media(orientation:landscape) and (max-width:1000px){.chart{height:72vh}.top{display:none}.mobile-toolbar{top:var(--safe-top)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="btc">₿</div><div><div class="title">FiboSwanny v5 · BTC</div><div class="sub">iPhone : ouverture directe BTC 4H · vue 15 jours</div></div></div>
    <div class="desktop-actions"><button class="btn primary" id="refreshAll">↻ Actualiser les 4 graphes</button><a class="btn" href="https://fr.tradingview.com/chart/LaSKuG13/" target="_blank" rel="noopener">TradingView ↗</a></div>
  </div>
  <div class="mobile-toolbar" id="mobileToolbar">
    <button class="btn active" data-range="15">15 j</button>
    <button class="btn" data-range="30">30 j</button>
    <button class="btn" data-range="all">Tout</button>
    <button class="btn" id="mobileRefresh">↻</button>
  </div>
  <div id="graphs" class="grid"></div>
</div>
<script>
(()=>{
const NS='http://www.w3.org/2000/svg',DAY=86400000;
const isMobile=()=>window.matchMedia('(max-width:760px)').matches || /iPhone|iPod/i.test(navigator.userAgent);
const CFG={
'4h':{label:'4H',market:'BTC / Dollar · 4H · Coinbase',rsi:[85.43,63.05,40.35,22.86],levels:[{p:'target',v:93819.49,target:true},{p:'1,272',v:98968.99,target:true},{p:'1,414',v:101657.33,target:true},{p:'0,00%',v:87397},{p:'38,20%',v:83706,n:'shallow fib'},{p:'61,80%',v:81425.75},{p:'100,00%',v:77734.78},{p:'127,20%',v:75106.66},{p:'141,40%',v:73734.62},{p:'200,00%',v:68072.56},{p:'300,00%',v:58410.34}],primaryTarget:93819.49},
'1d':{label:'1D',market:'BTC / Dollar · 1D · Coinbase',rsi:[80.61,57.64,39.40,24.83],levels:[{p:'2,000',v:109179.28,target:true},{p:'1,414',v:99322.42,target:true},{p:'1,272',v:96939.90,target:true},{p:'1,000',v:92365.70,target:true},{p:'0,00%',v:87397},{p:'38,20%',v:78882.14,n:'shallow fib'},{p:'61,80%',v:73621.65},{p:'100,00%',v:65106.79},{p:'127,20%',v:59043.85},{p:'141,40%',v:55878.64}],primaryTarget:92365.70},
'1w':{label:'1W',market:'BTC / Dollar · 1W · Coinbase',rsi:[82.78,58.29,40.60,23.96],levels:[{p:'target',v:113898.45,target:true},{p:'0,00%',v:87397},{p:'38,20%',v:80453.07,n:'shallow fib'},{p:'61,80%',v:76163.11},{p:'100,00%',v:69219.18},{p:'141,40%',v:61693.56},{p:'200,00%',v:51041.36}],primaryTarget:113898.45},
'1m':{label:'1M',market:'BTC / Dollar · 1M · INDEX',rsi:[96.95,61.95,42.69,19.02],levels:[{p:'0,00%',v:58051.07},{p:'38,20%',v:73278.36,n:'shallow fib'},{p:'61,80%',v:82685.79},{p:'100,00%',v:97913.08},{p:'127,20%',v:108755.55},{p:'141,40%',v:114415.95}],primaryTarget:null}
};
const state={}; let mobileRange=15;
function money(v){return Number.isFinite(+v)?Math.round(+v).toLocaleString('fr-FR')+' $':'—'}
function el(n,a={}){const z=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>v!=null&&z.setAttribute(k,v));return z}
function panel(tf,c){return `<section class="panel" id="panel-${tf}"><div class="head"><div><span class="kicker">FIBOSWANNY · ${c.label}</span><h2 style="margin:10px 0 4px">${c.market}</h2><div class="sub">Fibonacci de référence + Mood RSI ${c.label}</div></div><button class="btn" data-refresh="${tf}">↻ Actualiser</button></div><div class="chips"><span class="chip" id="sh-${tf}">Shallow Fib : —</span><span class="chip" id="ct-${tf}">Clôtures &gt; Shallow : — / 3</span><span class="chip" id="zn-${tf}">Zone : —</span><span class="chip" id="rs-${tf}">RSI 13 : —</span><span class="chip" id="tg-${tf}">Target : —</span></div><div class="chartwrap"><svg class="chart" id="svg-${tf}" viewBox="0 0 1500 800" preserveAspectRatio="none"></svg><div class="tip" id="tip-${tf}"></div></div><div class="status" id="st-${tf}">Chargement…</div><div class="thresholds"><div class="threshold"><b>Max Bull</b><span>${c.rsi[0].toFixed(2).replace('.',',')}</span></div><div class="threshold"><b>Seuil Bull</b><span>${c.rsi[1].toFixed(2).replace('.',',')}</span></div><div class="threshold"><b>Seuil Bear</b><span>${c.rsi[2].toFixed(2).replace('.',',')}</span></div><div class="threshold"><b>Min Bear</b><span>${c.rsi[3].toFixed(2).replace('.',',')}</span></div></div></section>`}
document.getElementById('graphs').innerHTML=Object.entries(CFG).map(([tf,c])=>panel(tf,c)).join('');
async function getJSON(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function tryUrls(url){let last;for(const u of [url,'https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?'+encodeURIComponent(url)]){try{return await getJSON(u)}catch(e){last=e}}throw last||Error('Source indisponible')}
async function load4h(){const end=Date.now(),start=end-120*DAY,out=[];for(let cur=start;cur<end;cur+=240*4*3600000){const ce=Math.min(end,cur+240*4*3600000),u=`https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=14400&start=${encodeURIComponent(new Date(cur).toISOString())}&end=${encodeURIComponent(new Date(ce).toISOString())}`,j=await tryUrls(u);if(Array.isArray(j))out.push(...j.map(r=>({ms:+r[0]*1000,low:+r[1],high:+r[2],open:+r[3],close:+r[4],volume:+r[5]})))}return [...new Map(out.filter(r=>r.close>0).map(r=>[r.ms,r])).values()].sort((a,b)=>a.ms-b.ms)}
async function loadDaily(){const j=await tryUrls('https://min-api.cryptocompare.com/data/v2/histoday?fsym=BTC&tsym=USD&limit=2000&e=CCCAGG'),a=j?.Data?.Data;if(!Array.isArray(a))throw Error('Historique journalier indisponible');return a.map(r=>({ms:+r.time*1000,open:+r.open,high:+r.high,low:+r.low,close:+r.close,volume:+(r.volumefrom||0)})).filter(r=>r.close>0)}
function aggregate(data,mode){const m=new Map();for(const r of data){const d=new Date(r.ms);let key;if(mode==='1w'){const day=(d.getUTCDay()+6)%7,dt=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-day));key=dt.toISOString().slice(0,10)}else key=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;let q=m.get(key);if(!q){q={ms:r.ms,open:r.open,high:r.high,low:r.low,close:r.close,volume:r.volume||0};m.set(key,q)}else{q.high=Math.max(q.high,r.high);q.low=Math.min(q.low,r.low);q.close=r.close;q.ms=r.ms;q.volume+=(r.volume||0)}}return [...m.values()].sort((a,b)=>a.ms-b.ms)}
function rsiWilder(data,n=13){if(data.length<=n)return [];let gains=0,losses=0,out=[];for(let i=1;i<=n;i++){const d=data[i].close-data[i-1].close;d>=0?gains+=d:losses-=d}let ag=gains/n,al=losses/n;const val=()=>al===0?100:100-100/(1+ag/al);out.push({ms:data[n].ms,v:val(),i:n});for(let i=n+1;i<data.length;i++){const d=data[i].close-data[i-1].close,g=d>0?d:0,l=d<0?-d:0;ag=(ag*(n-1)+g)/n;al=(al*(n-1)+l)/n;out.push({ms:data[i].ms,v:val(),i})}return out}
function shallow(c){return +c.levels.find(q=>q.p==='38,20%')?.v}
function mood(data,rr,c){const bullTh=c.rsi[1],bearTh=c.rsi[2],sh=shallow(c),rmap=new Map(rr.map(r=>[r.i,r.v]));let zone='BEAR',segments=[],start=data[0].ms;for(let i=1;i<data.length;i++){const rv=rmap.get(i),prev=rmap.get(i-1),three=i>=2&&data[i].close>sh&&data[i-1].close>sh&&data[i-2].close>sh;if(zone==='BEAR'&&((Number.isFinite(rv)&&Number.isFinite(prev)&&prev<=bullTh&&rv>bullTh)||three)){segments.push({zone,start,end:data[i].ms});zone='BULL';start=data[i].ms}else if(zone==='BULL'&&Number.isFinite(rv)&&Number.isFinite(prev)&&prev>=bearTh&&rv<bearTh){segments.push({zone,start,end:data[i].ms});zone='BEAR';start=data[i].ms}}segments.push({zone,start,end:data.at(-1).ms});return {zone,segments}}
function visibleRows(tf,allRows){if(tf!=='4h'||!isMobile())return allRows;if(mobileRange==='all')return allRows;const days=Number(mobileRange)||15,cut=allRows.at(-1).ms-days*DAY;return allRows.filter(r=>r.ms>=cut)}
function draw(tf){const c=CFG[tf],allRows=state[tf]?.rows||[],rows=visibleRows(tf,allRows),svg=document.getElementById('svg-'+tf),tip=document.getElementById('tip-'+tf);if(!rows.length)return;svg.replaceChildren();const mobile=isMobile()&&tf==='4h';const W=1500,H=800,L=mobile?34:62,R=mobile?84:110,T=mobile?8:20,priceB=mobile?570:555,rsiT=mobile?600:585,rsiB=mobile?786:770,minMs=rows[0].ms,maxMs=rows.at(-1).ms,allLevels=c.levels.map(q=>q.v),minP=Math.min(...rows.map(r=>r.low),...allLevels),maxP=Math.max(...rows.map(r=>r.high),...allLevels),pad=(maxP-minP)*(mobile?.035:.05)||1000,p0=minP-pad,p1=maxP+pad,x=ms=>L+(ms-minMs)/(maxMs-minMs)*(W-L-R),y=v=>T+(p1-v)/(p1-p0)*(priceB-T),yr=v=>rsiT+(110-v)/110*(rsiB-rsiT);svg.append(el('rect',{x:0,y:0,width:W,height:H,fill:'#a9d9aa'}));for(let i=0;i<=6;i++){const p=p0+i*(p1-p0)/6,yy=y(p);svg.append(el('line',{x1:L,x2:W-R,y1:yy,y2:yy,stroke:'#8bb98d','stroke-width':.7,opacity:.6}));const t=el('text',{x:W-R+6,y:yy+4,fill:'#315936','font-size':mobile?18:12,'font-weight':mobile?700:400});t.textContent=Math.round(p).toLocaleString('fr-FR');svg.append(t)}const sx=mobile?L+(W-L-R)*.48:L+(W-L-R)*.57;c.levels.forEach(q=>{const yy=y(q.v);svg.append(el('line',{x1:sx,x2:W-R,y1:yy,y2:yy,stroke:q.target?'#243b25':'#111','stroke-width':q.target?1.6:1.15,'stroke-dasharray':q.target?'7 6':null}));const t=el('text',{x:W-R-4,y:yy-(mobile?7:5),'text-anchor':'end',fill:'#111','font-size':mobile?17:11,'font-weight':mobile?700:400});t.textContent=mobile?`${q.p} · ${Math.round(q.v/1000)}k`:`${q.p} (${Math.round(q.v).toLocaleString('fr-FR')})`;svg.append(t);if(q.n){const n=el('text',{x:sx+(W-R-sx)*.40,y:yy+(mobile?7:4),fill:'#111','font-size':mobile?17:11,'font-weight':700});n.textContent='shallow';svg.append(n)}});const cw=Math.max(mobile?7:2,Math.min(tf==='1m'?14:tf==='1w'?8:mobile?16:5,(W-L-R)/rows.length*(mobile?.56:.65)));rows.forEach(r=>{const xx=x(r.ms),up=r.close>=r.open,col=up?'#008f85':'#d84a42',top=y(Math.max(r.open,r.close)),bot=y(Math.min(r.open,r.close));svg.append(el('line',{x1:xx,x2:xx,y1:y(r.high),y2:y(r.low),stroke:col,'stroke-width':mobile?2:1}));svg.append(el('rect',{x:xx-cw/2,y:top,width:cw,height:Math.max(mobile?2.5:1.5,bot-top),fill:col}))});svg.append(el('line',{x1:0,x2:W,y1:rsiT-12,y2:rsiT-12,stroke:'#547f58'}));const rrAll=rsiWilder(allRows,13),rr=rrAll.filter(r=>r.ms>=minMs&&r.ms<=maxMs),mi=mood(allRows,rrAll,c);mi.segments.filter(seg=>seg.end>=minMs&&seg.start<=maxMs).forEach(seg=>{const x0=x(Math.max(seg.start,minMs)),x1=x(Math.min(seg.end,maxMs));svg.append(el('rect',{x:x0,y:rsiT,width:Math.max(1,x1-x0),height:rsiB-rsiT,fill:seg.zone==='BULL'?'#55b96a':'#ef6b63',opacity:mobile?.30:.25}))});c.rsi.forEach((v,i)=>{const yy=yr(v),col=i===0?'#2c6e35':i===3?'#d92f2f':'#365a3b';svg.append(el('line',{x1:L,x2:W-R,y1:yy,y2:yy,stroke:col,'stroke-width':mobile?1.4:1}));const t=el('text',{x:W-R+6,y:yy+5,fill:col,'font-size':mobile?17:12,'font-weight':700});t.textContent=v.toFixed(1).replace('.',',');svg.append(t)});let d='';rr.forEach((q,i)=>d+=(i?'L':'M')+x(q.ms).toFixed(1)+','+yr(q.v).toFixed(1));svg.append(el('path',{d,fill:'none',stroke:'#111','stroke-width':mobile?2.2:1.5}));const rlast=rrAll.at(-1)?.v,last=allRows.at(-1),sh=shallow(c),above=allRows.slice(-3).filter(r=>r.close>sh).length;document.getElementById('sh-'+tf).textContent='Shallow : '+money(sh);document.getElementById('ct-'+tf).textContent=`Clôtures > Shallow : ${above} / 3`;document.getElementById('zn-'+tf).textContent='Zone : '+mi.zone;document.getElementById('rs-'+tf).textContent='RSI 13 : '+(Number.isFinite(rlast)?rlast.toFixed(1).replace('.',','):'—');document.getElementById('tg-'+tf).textContent='Target : '+money(c.primaryTarget);document.getElementById('st-'+tf).textContent=`${rows.length} bougies visibles · ${new Date(last.ms).toLocaleString('fr-FR')} · ${money(last.close)} · ${mi.zone}`;const tickCount=mobile?3:5;for(let i=0;i<tickCount;i++){const f=i/(tickCount-1),ms=minMs+(maxMs-minMs)*f,t=el('text',{x:L+f*(W-L-R),y:H-(mobile?5:10),'text-anchor':'middle',fill:'#315936','font-size':mobile?16:11,'font-weight':mobile?700:400});t.textContent=new Date(ms).toLocaleDateString('fr-FR',mobile?{day:'2-digit',month:'2-digit'}:tf==='1m'?{month:'short',year:'2-digit'}:{day:'2-digit',month:'short',year:tf==='1w'?'2-digit':undefined});svg.append(t)}svg.onpointermove=e=>{const b=svg.getBoundingClientRect(),px=(e.clientX-b.left)/b.width*W;if(px<L||px>W-R){tip.style.display='none';return}const ms=minMs+(px-L)/(W-L-R)*(maxMs-minMs),r=rows.reduce((best,a)=>Math.abs(a.ms-ms)<Math.abs(best.ms-ms)?a:best,rows[0]),rv=rrAll.reduce((best,a)=>Math.abs(a.ms-r.ms)<Math.abs(best.ms-r.ms)?a:best,rrAll[0]);tip.innerHTML=`<b>${new Date(r.ms).toLocaleString('fr-FR')}</b><br>O ${money(r.open)} · H ${money(r.high)}<br>L ${money(r.low)} · C <b>${money(r.close)}</b><br>RSI 13 : ${rv&&Number.isFinite(rv.v)?rv.v.toFixed(2).replace('.',','):'—'}<br>Shallow : ${money(sh)}`;tip.style.display='block';tip.style.left=Math.min(b.width-190,Math.max(6,e.clientX-b.left+10))+'px';tip.style.top=Math.min(b.height-115,Math.max(6,e.clientY-b.top+10))+'px'};svg.onpointerleave=()=>tip.style.display='none'}
async function refresh(tf,dailyCache){const st=document.getElementById('st-'+tf);st.textContent='Chargement…';try{let rows,source;if(tf==='4h'){rows=await load4h();source='Coinbase 4H'}else{const d=dailyCache||await loadDaily();if(tf==='1d'){rows=d.slice(-430);source='CryptoCompare journalier'}else if(tf==='1w'){rows=aggregate(d,'1w').slice(-280);source='agrégé semaine'}else{rows=aggregate(d,'1m').slice(-70);source='agrégé mois'}}if(rows.length<20)throw Error('Pas assez de données');state[tf]={rows,source};draw(tf)}catch(e){st.textContent='Indisponible : '+(e.message||e)}}
async function refreshAll(){const btn=document.getElementById('refreshAll');if(btn){btn.disabled=true;btn.textContent='Chargement…'}let daily=null;try{daily=await loadDaily()}catch(e){}await Promise.all(['4h','1d','1w','1m'].map(tf=>refresh(tf,daily)));if(btn){btn.disabled=false;btn.textContent='↻ Actualiser les 4 graphes'}}
function setRange(v){mobileRange=v==='all'?'all':Number(v);document.querySelectorAll('[data-range]').forEach(b=>b.classList.toggle('active',String(b.dataset.range)===String(v)));if(state['4h'])draw('4h')}
document.querySelectorAll('[data-refresh]').forEach(b=>b.addEventListener('click',()=>refresh(b.dataset.refresh)));
document.querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click',()=>setRange(b.dataset.range)));
document.getElementById('refreshAll')?.addEventListener('click',refreshAll);document.getElementById('mobileRefresh')?.addEventListener('click',()=>refresh('4h'));
window.addEventListener('resize',()=>{for(const tf of Object.keys(state))draw(tf)});
if(isMobile()) refresh('4h'); else refreshAll();
})();
</script>
</body></html>
