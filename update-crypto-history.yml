name: Update crypto history

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update BTC and ETH 4H files
        run: python scripts/update_crypto_history.py
      - name: Commit market history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/BTC_4h.json data/ETH_4h.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update BTC ETH 4H history"
            git push
          fi
